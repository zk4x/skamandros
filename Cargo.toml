[package]
name = "skamandros"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["zk4x"]
repository = "https://github.com/zk4x/skamandros"
homepage = "https://github.com/zk4x/skamandros"
description = "Tenstorrent kernel IR, allocator and driver. Builds libskamandros.so."
keywords = ["tenstorrent", "compiler", "gpu", "riscv", "tensix"]
categories = ["hardware-support", "compilers"]

# docs.rs has neither the RISC-V target nor llvm-tools, so it documents the
# compiler-only build; the default `firmware` feature needs both. The crate is
# Linux-only (`/dev/tenstorrent` through `tt-kmd`), so the tier-one targets the
# service would otherwise try -- Windows and macOS among them -- cannot build it.
[package.metadata.docs.rs]
no-default-features = true
targets = []

[lib]
name = "skamandros"
crate-type = ["cdylib", "rlib"]

[features]
# The device firmware: build the RISC-V images and embed them in the library.
# This is what needs the `riscv32im-unknown-none-elf` target and `llvm-tools`;
# the crate is the Tenstorrent backend whether or not they are built.
default = ["firmware"]
firmware = []

[dependencies]
# The architecture split (Blackhole under `arch::blackhole`, the `Arch` trait,
# Quasar's tables) is not on crates.io yet; the sibling tree is the source of
# truth until it is released.
tt-isa = { path = "../tt-isa" }
libloading = "0.8"
libc = "0.2"
# zyx's line: the slab's `SerBin`/`DeBin` impls are copied with the file.
nanoserde = { version = "0.2.1", default-features = false, features = ["std", "binary", "json"] }

# The release artifact is what ships: fully optimized, stripped, and
# `panic = "abort"` so a panic cannot unwind across the C ABI. This is zyx's
# `[profile.release]` verbatim.
[profile.release]
opt-level = 3
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
debug = 0
