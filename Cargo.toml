[package]
name = "tt-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/zk4x/tt-driver"
description = "Tenstorrent kernel IR, allocator and driver. Builds libTT.so."

[lib]
name = "TT"
crate-type = ["cdylib", "rlib"]

[features]
# The backend is the crate: on by default. The name is kept because the
# firmware build script (copied from zyx) gates on it.
default = ["tenstorrent"]
tenstorrent = []

[dependencies]
tt-isa = { path = "../tt-isa" }
libloading = "0.8"
libc = "0.2"
