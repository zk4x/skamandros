[package]
name = "skamandros"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["zk4x"]
repository = "https://github.com/zk4x/skamandros"
homepage = "https://github.com/zk4x/skamandros"
description = "Tenstorrent kernel IR, allocator and driver. Builds libskamandros.so."

[lib]
name = "skamandros"
crate-type = ["cdylib", "rlib"]

[features]
# The backend is the crate: on by default. The name is kept because the
# firmware build script (copied from zyx) gates on it.
default = ["tenstorrent"]
tenstorrent = []

[dependencies]
tt-isa = "0.2.0"
libloading = "0.8"
libc = "0.2"
# zyx's line: the slab's `SerBin`/`DeBin` impls are copied with the file.
nanoserde = { version = "0.2.1", default-features = false, features = ["std", "binary", "json"] }

# The release artifact is what ships: fully optimized, stripped, and
# `panic = "abort"` so a panic cannot unwind across the C ABI. This is zyx's
# `[profile.release]` verbatim.
[profile.release]
opt-level = 3
strip = true
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
debug = 0
